server.port=8081
spring.datasource.url=jdbc:h2:mem:importador-arquivos-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

importador-arquivos.cron: 0/1 * * * * ?
importador-arquivos.data.in: /data/in
importador-arquivos.data.out: /data/out
importador-arquivos.data.invalid: /data/invalid