server.port=8081
spring.datasource.url=jdbc:h2:mem:importador-arquivos-db-teste;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

importador-arquivos.cron: 0 0 0/1 1/1 * ?
importador-arquivos.data.in: ./src/test/resources/data/in
importador-arquivos.data.out: ./src/test/resources/data/out
importador-arquivos.data.invalid: ./src/test/resources/data/invalid
importador-arquivos.data.test: ./src/test/resources/data/test